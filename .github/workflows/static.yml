name: Deploy to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Upload and deploy run in separate jobs: deploying in the same job as the
  # upload can find no artifact (https://github.com/actions/deploy-pages/issues/451).
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: node 24 ❇️
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Build
        run: |
          npm ci
          npm run build
          touch ./dist/.nojekyll && echo 'import.bmlt.app' > ./dist/CNAME
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
