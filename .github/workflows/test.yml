name: test
on:
  push:
    branches-ignore: ['main']

jobs:
  test-ts:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout 🛒
        uses: actions/checkout@v7

      - name: node 24 ❇️
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: make npm ♦️
        run: |
          npm ci

      - name: make lint-js 🧹
        run: |
          npm run lint

      - name: make test-js 🧪
        run: |
          npm run test
